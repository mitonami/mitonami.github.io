<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Homepage</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    header {
      background: #333;
      color: white;
      padding: 25px 40px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    nav {
      background: #555;
      padding: 12px 40px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-right: 25px;
    }

    nav a:hover {
      color: #ffd700;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <header>
    <h1>My Homepage</h1>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Gallery</a>
    <a href="#">Contact</a>
  </nav>

  <main>
    <h2>Welcome!</h2>
    <p>ホームページへようこそ。</p>
  </main>

</html>
